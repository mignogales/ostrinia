
name: peakweather
# target: "nb_peakweather"
target: "hatching"
window: 12
horizon: 1
delay: 14
stride: 1
splitting:
  val_len: 0.125
  test_len: 0.125
connectivity:
  method: distance
  threshold: 0.9
  include_self: False
  layout: edge_index

log_metrics: ["mae", "mre", "mse", "loss"]
add_covariates: true
smooth: false
sampling: 2
full_normalization: false
drop_nodes: false

add_second_target: false

spatial_information: true

synth_data: "v3"